{% assign d = site.data[page.lang] | default: site.data.zh %}
<section class="cv-section" id="profile">
  <div class="cv-sec-head">
    <span class="cv-sec-bar"></span>
    <h2>{{ d.t.profileTitle }} <span class="cv-sec-en">{{ d.t.profileEn }}</span></h2>
  </div>
  <p class="cv-summary">{{ d.author.summary }}</p>
  <p class="cv-summary">{{ d.author.intro }}</p>
  <div class="cv-stats">
    <div class="cv-stat">
      <div class="cv-stat-num">10+<small>{{ d.t.statExpUnit }}</small></div>
      <div class="cv-stat-label">{{ d.t.statExp }}</div>
    </div>
    <div class="cv-stat">
      <div class="cv-stat-num">20<small>{{ d.t.statRevUnit }}</small></div>
      <div class="cv-stat-label">{{ d.t.statRev }}</div>
    </div>
    <div class="cv-stat">
      <div class="cv-stat-num">13<small>{{ d.t.statTeamUnit }}</small></div>
      <div class="cv-stat-label">{{ d.t.statTeam }}</div>
    </div>
  </div>
</section>
