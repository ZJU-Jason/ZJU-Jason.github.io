<section class="section" id="about">
  <div class="container">
    <div class="section-header fade-in">
      <span class="label">About</span>
      <h2>关于我</h2>
      <p>深耕汽车电子与新能源领域的销售管理者</p>
    </div>
    <div class="about-grid">
      <div class="about-text fade-in">
        <p>{{ site.author.summary }}</p>
        <p>从德国大陆集团到保隆科技，再到小米投资的维发电子，我始终专注于将技术价值转化为商业成果。善于在不确定性中寻找机会，在红海市场中开辟蓝海，在规模化竞争中建立护城河。</p>
      </div>
      <div class="about-info fade-in">
        <div class="about-info-item">
          <i class="fas fa-map-pin"></i>
          <div>
            <div class="info-label">所在地</div>
            <div class="info-value">{{ site.author.location }}</div>
          </div>
        </div>
        <div class="about-info-item">
          <i class="fas fa-envelope"></i>
          <div>
            <div class="info-label">邮箱</div>
            <div class="info-value">{{ site.author.email }}</div>
          </div>
        </div>
        <div class="about-info-item">
          <i class="fas fa-phone-alt"></i>
          <div>
            <div class="info-label">电话</div>
            <div class="info-value">{{ site.author.phone }}</div>
          </div>
        </div>
        <div class="about-info-item">
          <i class="fas fa-birthday-cake"></i>
          <div>
            <div class="info-label">出生日期</div>
            <div class="info-value">1990/10/14</div>
          </div>
        </div>
        <div class="about-info-item">
          <i class="fas fa-language"></i>
          <div>
            <div class="info-label">语言</div>
            <div class="info-value">中文 · 英语（IELTS 6.5）</div>
          </div>
        </div>
        <div class="about-info-item">
          <i class="fas fa-certificate"></i>
          <div>
            <div class="info-label">认证</div>
            <div class="info-value">Six Sigma 绿带</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
