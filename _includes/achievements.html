<section class="cv-section" id="achievements">
  <div class="cv-sec-head">
    <span class="cv-sec-bar"></span>
    <h2>关键成就 <span class="cv-sec-en">Key Achievements</span></h2>
  </div>
  <div class="ach-grid">
    {% for achievement in site.achievements %}
    <div class="ach-card fade-in">
      {% if achievement.logo %}
      <img class="ach-logo" src="{{ '/assets/images/' | append: achievement.logo | relative_url }}" alt="">
      {% endif %}
      <div class="ach-metric">{{ achievement.metric }}</div>
      <h3>{{ achievement.title }}</h3>
      <p>{{ achievement.description }}</p>
      <div class="ach-tags">
        {% for tag in achievement.tags %}
        <span class="ach-tag">{{ tag }}</span>
        {% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
</section>
