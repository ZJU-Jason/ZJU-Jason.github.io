{% assign d = site.data[page.lang] | default: site.data.zh %}
<header class="site-header" id="site-header">
  <div class="nav-inner">
    <a href="#" class="nav-logo">{{ d.author.name }} <span>{{ d.author.name_en }}</span></a>
    <nav class="nav-links" id="nav-links">
      <a href="#profile">{{ d.t.nav.profile }}</a>
      <a href="#experience">{{ d.t.nav.experience }}</a>
      <a href="#achievements">{{ d.t.nav.achievements }}</a>
      <a href="#skills">{{ d.t.nav.skills }}</a>
      <a href="#education">{{ d.t.nav.education }}</a>
      <a href="{{ d.t.langUrl }}" class="lang-switch">{{ d.t.langSwitch }}</a>
      <button class="nav-print" id="nav-print" type="button"><i class="fas fa-print"></i> {{ d.t.nav.savePdf }}</button>
    </nav>
    <button class="mobile-toggle" id="mobile-toggle" aria-label="menu"><i class="fas fa-bars"></i></button>
  </div>
</header>
