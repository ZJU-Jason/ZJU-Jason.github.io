<section class="cv-section" id="experience">
  <div class="cv-sec-head">
    <span class="cv-sec-bar"></span>
    <h2>工作经历 <span class="cv-sec-en">Experience</span></h2>
  </div>
  <div class="exp-list">
    {% for item in site.experience %}
    <div class="exp-item fade-in">
      <span class="exp-dot"></span>
      <div class="exp-body">
        <div class="exp-top">
          {% if item.logo %}
          <img class="exp-logo" src="{{ '/assets/images/' | append: item.logo | relative_url }}" alt="{{ item.company }}">
          {% endif %}
          <h3 class="exp-company">{{ item.company }}</h3>
          {% if item.url %}
          <a class="exp-link" href="{{ item.url }}" target="_blank" rel="noopener" title="官网">
            <i class="fas fa-external-link-alt"></i>
          </a>
          {% endif %}
        </div>
        <div class="exp-meta">
          <span class="exp-period-badge"><i class="far fa-calendar-alt"></i> {{ item.period }}</span>
          <span class="exp-position">{{ item.position }} · {{ item.location }}</span>
        </div>
        <ul class="exp-highlights">
          {% for highlight in item.highlights %}
          <li>{{ highlight }}</li>
          {% endfor %}
        </ul>
      </div>
    </div>
    {% endfor %}
  </div>
</section>
