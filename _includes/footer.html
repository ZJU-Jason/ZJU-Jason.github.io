<footer class="site-footer">
  <div class="container">
    <div class="footer-inner">
      <span>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }} ({{ site.author.name_en }}). All rights reserved.</span>
      <div class="footer-links">
        <a href="mailto:{{ site.author.email }}" title="Email">
          <i class="fas fa-envelope"></i>
        </a>
        <a href="tel:{{ site.author.phone | replace: ' ', '' }}" title="Phone">
          <i class="fas fa-phone-alt"></i>
        </a>
      </div>
    </div>
  </div>
</footer>
